datasets: 
  imagenetpt: /media/solis/DATA/imagenet

epochs:
  imagenetpt: 
    - all

collect:
  resnet50pt:
    - path: conv1
      tag: conv1
    - path: layer1
      tag: layer1
    - path: layer2
      tag: layer2
    - path: layer3
      tag: layer3
    - path: layer4
      tag: layer4
    - path: fc
      tag: penultimate

runs:
  resnet50pt_imagenetsb:
    model: resnet50pt
    dataset: imagenetpt

do:
  - resnet50pt_imagenetsb

checkpoints_dir: null
save_dir: /media/santripta/data2/ImagenetPTInference/landscape_data/
save_every_batches: 120
ds_subsample: 130000
device: cuda:0