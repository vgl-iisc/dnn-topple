datasets:
  cifar: ./datasets/cifar/data

train:
  seed: 34152371
  model: resnet18
  dataset: cifar

  batch_size: 128
  epochs: 150
  lr: 0.01
  weight_decay: 0.0005

  opt:
    type: sgd

  schedule:
    type: cosineWR

  checkpoints_dir: /home/santripta/data_2/tvcg_multifield_checkpoints/
  tensorboard_dir: /home/santripta/data_2/tvcg_multifield_tensorboard/

  only_last_best: true

infer:
  output_dir: /home/santripta/data_2/tvcg_multifield_infer/

  collect:
    - path: layer1
      tag: 5
    - path: layer2
      tag: 4
    - path: layer3
      tag: 3
    - path: layer4
      tag: 2
    - path: fc
      tag: 1

  metrics:
    - entropy
    - margin
    - gradnorm
    - gradnorm_importance

  epochs: 8

name: resnet_cifar
device: cuda:1
