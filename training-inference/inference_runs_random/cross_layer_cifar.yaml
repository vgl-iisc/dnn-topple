datasets: 
  cifar: ./datasets/cifar/data
  mnist: ./datasets/mnist/data

epochs:
  cifar: 
    - last
  mnist: 
    - last

collect:
  # after and between dense blocks
  densenet121:
    - path: classifier
      tag: 1
    - path: features.denseblock4
      tag: 2
    - path: features.transition3
      tag: 3
    - path: features.denseblock3
      tag: 4
    - path: features.transition2
      tag: 5
    - path: features.denseblock2
      tag: 6
    - path: features.transition1
      tag: 7
    - path: features.denseblock1
      tag: 8

  # after each set of 2 basic blocks
  resnet18:
    - path: fc
      tag: 1
    - path: layer4
      tag: 2
    - path: layer3
      tag: 3
    - path: layer2
      tag: 4
    - path: layer1
      tag: 5

  # after each pooling layer
  vgg16:
    - path: classifier[6]
      tag: 1
    - path: classifier
      tag: 2
    - path: features[24]
      tag: 3
    - path: features[17]
      tag: 4
    - path: features[10]
      tag: 5
    - path: features[5]
      tag: 6
    - path: features
      tag: 7

  # each layer is 3 bottleneck blocks
  wide_resnet50_2:
    - path: fc
      tag: 1
    - path: layer4
      tag: 2
    - path: layer3
      tag: 3
    - path: layer2
      tag: 4
    - path: layer1
      tag: 5

runs:
  densenet_cifar:
    model: densenet121
    dataset: cifar

  densenet_mnist:
    model: densenet121
    dataset: mnist

  resnet_cifar:
    model: resnet18
    dataset: cifar

  resnet_mnist:
    model: resnet18
    dataset: mnist

  vgg_cifar:
    model: vgg16
    dataset: cifar

  vgg_mnist:
    model: vgg16
    dataset: mnist

do:
  - densenet_mnist
  - resnet_mnist
  - vgg_mnist

checkpoints_dir: /media/solis/DATA/Santripta/Training_random/checkpoints/
save_dir: /media/santripta/data2/Inference_better/landscape_data_random_cifar/
device: cuda:0
random: [0.05, 0.0, 0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.6, 0.7, 0.8, 0.9, 1.0]