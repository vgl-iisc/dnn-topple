datasets:
  imagenet: ./datasets/imagenet/data

train:
  seed: 1771523575
  model: resnet50pt
  dataset: imagenet

  batch_size: 64
  epochs: 1
  lr: 0.0
  betas: [0.9, 0.999]
  weight_decay: 1e-4
  opt:
    type: sgd
    momentum: 0.9
  schedule: 
    type: step
    step_size: 30
    gamma: 0.1

  checkpoints_dir: /home/santripta/data_2/imagenetpt_smallinf/checkpoints/
  tensorboard_dir: /home/santripta/data_2/imagenetpt_smallinf/tensorboard/
  only_last_best: true

infer:
  output_dir: /home/santripta/data_2/imagenetpt_smallinf/landscape_data

  collect:
    - path: conv1
      tag: conv1
    - path: layer1
      tag: layer1
    - path: layer2
      tag: layer2
    - path: layer3
      tag: layer3
    - path: layer4
      tag: layer4
    - path: fc
      tag: penultimate

  spatial_subsample: 3
  ds_subsample: 300000

  epochs: 1

name: resnet50pt_imagenet
device: cuda:0